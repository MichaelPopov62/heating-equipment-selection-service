<!doctype html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HeatCalc Pro — підбір опалення для дому та квартири</title>
  <meta name="description"
    content="Сервіс розрахунку тепловтрат та підбору опалювального обладнання для будинку чи квартири. Онлайн-калькулятор котла, радіаторів і ГВП." />
  <meta name="robots" content="index, follow" />
  <!-- HEATCALC_JSON_LD -->
  <!-- Критичні стилі першого paint (FCP) до завантаження JS-бандла -->
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      --text: #6b6375;
      --text-h: #08060d;
      --bg: #f4f7fb;
      --border: #e5e4e7;
      --accent: #2563eb;
      --accent-border: rgba(37, 99, 235, 0.45);
      --shell-max-width: 100%;
      --sans: system-ui, 'Segoe UI', Roboto, sans-serif;
      --heading: system-ui, 'Segoe UI', Roboto, sans-serif;
      color-scheme: light dark;
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.45;
      letter-spacing: 0.18px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text: #9ca3af;
        --text-h: #f3f4f6;
        --bg: #0f1117;
        --border: #2e303a;
        --accent: #60a5fa;
        --accent-border: rgba(96, 165, 250, 0.45);
      }
    }

    @media (min-width: 768px) {
      :root {
        font-size: 18px;
      }
    }

    html {
      overflow-x: clip;
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      max-width: 100%;
      overflow-x: clip;
      background: var(--bg);
      color: var(--text);
    }

    #root {
      width: 100%;
      max-width: var(--shell-max-width);
      min-height: 100svh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow-x: clip;
      text-align: center;
      border-inline: 1px solid var(--border);
      background: var(--bg);
    }

    /* Static LCP shell — лише hero+CTA (без фейкового header) до mount React у #root */
    .static-app-shell {
      position: fixed;
      inset: 0;
      z-index: 10;
      width: 100%;
      max-width: var(--shell-max-width);
      margin: 0 auto;
      left: 0;
      right: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100svh;
      opacity: 1;
      transition: opacity 220ms ease;
      border-inline: 1px solid var(--border);
      background: var(--bg);
      overflow-x: clip;
    }

    .static-app-shell--fade-out {
      opacity: 0;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .static-app-shell {
        transition: none;
      }
    }

    .static-start-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px 12px 32px;
    }

    .static-start-screen__hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 420px;
    }

    .static-start-screen__logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .static-start-screen__title {
      margin: 0;
      font: 700 22px/1.25 var(--heading);
      color: var(--text-h);
    }

    .static-start-screen__lead {
      margin: 0;
      font: 400 15px/1.5 var(--sans);
      color: var(--text);
    }

    .static-start-screen__actions {
      display: flex;
      flex-direction: column;
      width: min(100%, 360px);
    }

    .static-start-screen__primary {
      width: 100%;
      border-radius: 12px;
      padding: 12px 16px;
      font: 600 14px/1.2 var(--sans);
      border: 1px solid var(--accent-border);
      background: var(--accent);
      color: #fff;
      cursor: default;
      opacity: 0.92;
    }

    @media (min-width: 768px) {
      .static-start-screen {
        padding-inline: 20px;
      }

      .static-start-screen__title {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <div id="static-app-shell" class="static-app-shell">
    <main class="static-start-screen" aria-labelledby="static-start-screen-title">
      <div class="static-start-screen__hero">
        <svg class="static-start-screen__logo" xmlns="http://www.w3.org/2000/svg" width="44" height="44"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M4 10l8-7l8 7" />
          <path d="M5 10v10a1 1 0 0 0 1 1h3m8-11v10a1 1 0 0 1-1 1h-3" />
          <path d="M9 21v-6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v6" />
          <path d="M12 14v-7" />
          <path d="M12 4v3" />
        </svg>
        <h1 id="static-start-screen-title" class="static-start-screen__title">
          Підбір опалення для дому та квартири
        </h1>
        <p class="static-start-screen__lead">
          Заповніть анкету об'єкта — сервіс розрахує тепловтрати, підбере котел, радіатори, ГВП та
          гідравліку за каталогом обладнання.
        </p>
      </div>
      <div class="static-start-screen__actions">
        <button type="button" class="static-start-screen__primary" disabled aria-disabled="true">
          Почати новий розрахунок
        </button>
      </div>
    </main>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
