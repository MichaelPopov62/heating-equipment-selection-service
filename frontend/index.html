<!doctype html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HeatCalc Pro — підбір опалення для дому та квартири</title>
  <meta name="description"
    content="Сервіс розрахунку тепловтрат та підбору опалювального обладнання для будинку чи квартири. Онлайн-калькулятор котла, радіаторів і ГВП." />
  <meta name="robots" content="index, follow" />
  <!-- HEATCALC_JSON_LD -->
  <!-- Критичні стилі першого paint (FCP) до завантаження JS-бандла -->
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      --text: #6b6375;
      --text-h: #08060d;
      --bg: #f4f7fb;
      --border: #e5e4e7;
      --shell-max-width: 100%;
      --sans: system-ui, 'Segoe UI', Roboto, sans-serif;
      color-scheme: light dark;
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.45;
      letter-spacing: 0.18px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text: #9ca3af;
        --text-h: #f3f4f6;
        --bg: #0f1117;
        --border: #2e303a;
      }
    }

    @media (min-width: 768px) {
      :root {
        font-size: 18px;
      }
    }

    html {
      overflow-x: clip;
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      max-width: 100%;
      overflow-x: clip;
      background: var(--bg);
      color: var(--text);
    }

    #root {
      width: 100%;
      max-width: var(--shell-max-width);
      min-height: 100svh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow-x: clip;
      text-align: center;
      border-inline: 1px solid var(--border);
      background: var(--bg);
    }

    /* Static LCP shell — замінюється React при mount #root */
    .static-start-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      min-height: 100svh;
      padding: 24px 12px 32px;
    }

    .static-start-screen__hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 420px;
    }

    .static-start-screen__title {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-h);
    }

    .static-start-screen__lead {
      margin: 0;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--text);
    }

    @media (min-width: 768px) {
      .static-start-screen {
        padding-inline: 20px;
      }

      .static-start-screen__title {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <main class="static-start-screen" aria-labelledby="static-start-screen-title">
      <div class="static-start-screen__hero">
        <h1 id="static-start-screen-title" class="static-start-screen__title">
          Підбір опалення для дому та квартири
        </h1>
        <p class="static-start-screen__lead">
          Заповніть анкету об'єкта — сервіс розрахує тепловтрати, підбере котел, радіатори, ГВП та
          гідравліку за каталогом обладнання.
        </p>
      </div>
    </main>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
