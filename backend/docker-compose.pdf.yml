# Локальный запуск API с PDF (Chromium в образе).
# Из корня репо: docker compose -f backend/docker-compose.pdf.yml up --build
services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      PDF_BROWSER_EXECUTABLE: /usr/bin/chromium
      PDF_RENDER_TIMEOUT_MS: "30000"
      PDF_MAX_CONCURRENT: "2"
      PUPPETEER_SKIP_DOWNLOAD: "true"
