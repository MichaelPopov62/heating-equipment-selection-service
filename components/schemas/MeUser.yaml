type: object
required:
  - id
  - email
  - emailVerified
  - role
  - subscription
properties:
  id:
    type: string
    description: users._id (string)
  email:
    type: string
    format: email
  emailVerified:
    type: boolean
  role:
    $ref: ./UserRole.yaml
  subscription:
    $ref: ./SubscriptionTier.yaml
  authProvider:
    type: string
    enum:
      - clerk
      - auth0
  name:
    type: string
  devMode:
    type: boolean
    description: true — синтетический профиль dev без JWT (PROJECTS_AUTH_ENABLED=false)
